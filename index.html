<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swag County</title>
<meta name="description" content="Building cool shit for the love of the game">
<link rel="icon" type="image/svg+xml" href="/assets/swag_county_favicon.svg">
<meta name="theme-color" content="#0d0d0d">
<style>
:root {
  --bg-near-black: #0d0d0d;
  --bg-deep-purple: #1a0a2e;
  --fg: #f0ecf7;
  --dim: #9a92ab;
  --neon-purple: #b44fff;
  --neon-teal: #00f5d4;
  --card-bg: rgba(255, 255, 255, 0.025);
  --card-border: rgba(180, 79, 255, 0.18);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
  color: var(--fg);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  /* Brand background: clean dark gradient, near-black into deep purple. */
  background-color: var(--bg-near-black);
  background-image: linear-gradient(135deg, var(--bg-near-black) 0%, var(--bg-deep-purple) 100%);
  background-attachment: fixed;
  /* the page is interactive (click / drag spawns stars) — suppress native
     text-selection + element drag so a drag never selects text or shows the
     browser's "no-drop" cursor */
  -webkit-user-select: none;
  user-select: none;
}
/* the pixel starfield canvas sits behind all content */
#sky {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
main {
  position: relative;
  z-index: 1;
  max-width: 620px;
  margin: 0 auto;
  padding: 1.75rem 1.5rem 2rem;
  flex: 1;
  width: 100%;
}
.logo {
  display: block;
  width: 100%;
  max-width: 220px;
  height: auto;
  margin: 0 auto 0.75rem;
}
.tagline {
  font-size: 1.4rem;
  font-weight: 700;
  text-align: center;
  letter-spacing: 0.01em;
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-teal));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 16px rgba(180, 79, 255, 0.30));
  margin: 0 0 2rem;
}
.projects {
  display: grid;
  gap: 0.9rem;
  margin-bottom: 3rem;
}
.card {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 1.1rem 1.4rem;
  text-decoration: none;
  color: inherit;
  display: block;
  transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
}
.card:hover, .card:focus-visible {
  transform: translateY(-1px);
  border-color: var(--neon-purple);
  box-shadow: 0 0 0 1px rgba(180, 79, 255, 0.25), 0 8px 30px -10px rgba(180, 79, 255, 0.35);
  outline: none;
}
.card .name {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0 0 0.2rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.card-icon {
  width: 1.6em;
  height: 1.6em;
  flex-shrink: 0;
  border-radius: 6px;
  display: block;
}
.card .desc {
  color: var(--fg);
  margin: 0;
  font-size: 0.95rem;
}
.card .desc strong {
  color: #e888c0;
  font-weight: 700;
}
.badge {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
  padding: 0.18rem 0.5rem;
  border-radius: 999px;
  color: var(--bg-near-black);
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-teal));
}
.card .badge {
  position: absolute;
  top: 0.75rem;
  right: 0.85rem;
}
.empty-slot {
  border: 1px dashed var(--card-border);
  border-radius: 10px;
  padding: 1.1rem 1.4rem;
  color: var(--dim);
  font-size: 0.9rem;
  font-style: italic;
}
footer {
  position: relative;
  z-index: 1;
  border-top: 1px solid var(--card-border);
  padding: 1.4rem;
  text-align: center;
  font-size: 0.85rem;
  color: var(--dim);
}
footer a {
  color: var(--dim);
  text-decoration: underline;
  text-decoration-color: var(--card-border);
  text-underline-offset: 3px;
  transition: color 0.14s ease;
}
footer a:hover { color: var(--neon-teal); }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
<img class="logo" src="/assets/swag_county_logo.svg" alt="Swag County">
<p class="tagline">Building cool shit for the love of the game</p>

<div class="projects">
  <a class="card" href="/shuffleify">
    <span class="badge">In development</span>
    <p class="name"><img class="card-icon" src="/assets/shuffleify_logo.png" alt="">shuffleify</p>
    <p class="desc"><strong>Spotify's shuffle sucks &mdash; everybody knows it.</strong><br>Ready for a real shuffle?</p>
  </a>
  <div class="empty-slot">More soon.</div>
</div>
</main>
<footer>
  Bug reports, kind words, weird ideas &mdash; <a href="mailto:will@swagcounty.com">will@swagcounty.com</a>
</footer>

<script src="/assets/starfield.js" defer></script>
</body>
</html>
