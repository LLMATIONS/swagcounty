<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swag County</title>
<meta name="description" content="A small workshop. We make weird, useful things and put them on the internet.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>%F0%9F%AA%84</text></svg>">
<style>
:root {
  --bg: #fafaf7;
  --fg: #1a1a1a;
  --dim: #6b6b6b;
  --accent: #7c3aed;
  --card-bg: #fff;
  --card-border: #e5e5e0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14141a;
    --fg: #f0f0e8;
    --dim: #999;
    --accent: #a78bfa;
    --card-bg: #1f1f28;
    --card-border: #2e2e3a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
main {
  max-width: 620px;
  margin: 0 auto;
  padding: 4.5rem 1.5rem 2rem;
  flex: 1;
  width: 100%;
}
h1 {
  font-size: 2.25rem;
  margin: 0 0 0.25rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.tagline {
  color: var(--dim);
  font-size: 1.05rem;
  margin: 0 0 3rem;
}
.projects {
  display: grid;
  gap: 0.9rem;
  margin-bottom: 3rem;
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 1.1rem 1.4rem;
  text-decoration: none;
  color: inherit;
  display: block;
  transition: transform 0.12s ease, border-color 0.12s ease;
}
.card:hover, .card:focus-visible {
  transform: translateY(-1px);
  border-color: var(--accent);
  outline: none;
}
.card .name {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0 0 0.2rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.card .desc {
  color: var(--dim);
  margin: 0;
  font-size: 0.95rem;
}
.badge {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  font-weight: 700;
  border: 1px solid var(--accent);
  padding: 0.15rem 0.45rem;
  border-radius: 999px;
}
.empty-slot {
  border: 1px dashed var(--card-border);
  border-radius: 10px;
  padding: 1.1rem 1.4rem;
  color: var(--dim);
  font-size: 0.9rem;
  font-style: italic;
}
footer {
  border-top: 1px solid var(--card-border);
  padding: 1.4rem;
  text-align: center;
  font-size: 0.85rem;
  color: var(--dim);
}
footer a { color: var(--dim); text-decoration: underline; text-decoration-color: var(--card-border); text-underline-offset: 3px; }
footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Swag County</h1>
<p class="tagline">A small workshop. We make weird, useful things.</p>

<div class="projects">
  <a class="card" href="/shuffleify">
    <p class="name">Shuffleify <span class="badge">In build</span></p>
    <p class="desc">Spotify says it's shuffling. It is not. This fixes that.</p>
  </a>
  <div class="empty-slot">More soon.</div>
</div>
</main>
<footer>
  Bug reports, kind words, weird ideas &mdash; <a href="mailto:will@swagcounty.com">will@swagcounty.com</a>
</footer>
</body>
</html>
