<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b44fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f5d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Diamond mark on a transparent background -->
  <g transform="translate(32, 32)" filter="url(#glow)">
    <!-- Outer diamond -->
    <polygon points="0,-20 12,-4 0,13 -12,-4" fill="none" stroke="url(#neonGrad)" stroke-width="1.8"/>
    <!-- Inner diamond filled -->
    <polygon points="0,-11 7,0 0,8 -7,0" fill="url(#neonGrad)" opacity="0.95"/>
    <!-- Side accent lines -->
    <line x1="-20" y1="-4" x2="-14" y2="-4" stroke="#00f5d4" stroke-width="1.5" opacity="0.8"/>
    <line x1="14" y1="-4" x2="20" y2="-4" stroke="#00f5d4" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>
